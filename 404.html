<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found - PixiWishh ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #fcf8f2;
            --pure-white: #ffffff;
            --soft-pink: #ffb7c5;
            --deep-pink: #ff8fa3;
            --light-purple: #e2d1f9;
            --text-dark: #4a3b4c;
            --accent-gold: #ffd700;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--bg-cream), var(--light-purple));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .error-container {
            background: var(--pure-white);
            border-radius: 28px;
            padding: 50px 40px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(74, 59, 76, 0.15);
            border: 3px dashed var(--soft-pink);
            position: relative;
            overflow: hidden;
        }
        
        .error-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 143, 163, 0.1) 0%, transparent 70%);
        }
        
        .error-code {
            font-family: 'Fredoka', cursive;
            font-size: 8rem;
            color: var(--deep-pink);
            line-height: 1;
            margin-bottom: 16px;
            animation: floatSlow 3s ease-in-out infinite;
        }
        
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        
        .error-title {
            font-family: 'Fredoka', cursive;
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 12px;
        }
        
        .error-message {
            color: #6d586e;
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 1.1rem;
        }
        
        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 28px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, var(--soft-pink), var(--light-purple));
            color: var(--text-dark);
            border: none;
            box-shadow: 0 4px 15px rgba(255, 143, 163, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 143, 163, 0.5);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-dark);
            border: 2px solid var(--soft-pink);
        }
        
        .btn-secondary:hover {
            background: var(--soft-pink);
            transform: translateY(-2px);
        }
        
        .error-decor {
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
            pointer-events: none;
            animation: floatSlow 4s ease-in-out infinite;
        }
        
        .decor-1 { top: 20px; left: 20px; animation-delay: 0s; }
        .decor-2 { top: 20px; right: 20px; animation-delay: 1s; }
        .decor-3 { bottom: 20px; left: 20px; animation-delay: 2s; }
        .decor-4 { bottom: 20px; right: 20px; animation-delay: 3s; }
        
        @media (max-width: 480px) {
            .error-code { font-size: 5rem; }
            .error-title { font-size: 1.5rem; }
            .btn { padding: 12px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="error-decor decor-1">✨</span>
        <span class="error-decor decor-2">💫</span>
        <span class="error-decor decor-3">🌸</span>
        <span class="error-decor decor-4">🪄</span>
        
        <div class="error-code">404</div>
        <h1 class="error-title">Oops! Page Not Found 🌸</h1>
        <p class="error-message">The page you're looking for seems to have wandered off into a sparkly dimension. Don't worry, we'll help you find your way back!</p>
        
        <div class="error-actions">
            <a href="/" class="btn btn-primary">🏠 Back to Home</a>
            <a href="#shop" class="btn btn-secondary">🛍️ Shop Jewelry</a>
        </div>
    </div>
    
    <script>
        // Auto redirect after 10 seconds
        setTimeout(function() {
            window.location.href = '/';
        }, 10000);
    </script>
</body>
</html>
